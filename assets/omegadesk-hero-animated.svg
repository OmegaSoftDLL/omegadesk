<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="100%" role="img" aria-labelledby="odHeroTitle odHeroDesc">
  <title id="odHeroTitle">OmegaDesk — Sub-8ms Hardware Remote Desktop, QUIC &amp; WireGuard Mesh Architecture</title>
  <desc id="odHeroDesc">Animated 4-stage pipeline showing Rust Hardware Capture (DXGI / PipeWire), Zero-Copy H.264/AV1 NVENC/QSV/AMF Encoding, QUIC + Built-in WireGuard Mesh Transport, and Native + WebCodecs Client with RMM &amp; Zero-Trust HuJSON Policy Gate.</desc>

  <defs>
    <linearGradient id="bgOdHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#060A15"/>
    </linearGradient>
    <linearGradient id="stageCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1930"/>
      <stop offset="100%" stop-color="#080F1E"/>
    </linearGradient>
    <linearGradient id="pipeCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      @keyframes dashFlow { to { stroke-dashoffset: -36; } }
      @keyframes pulsePill { 0%, 100% { opacity: 0.92; } 50% { opacity: 1; } }
      .flow-line { stroke-dasharray: 6 4; animation: dashFlow 1.4s linear infinite; }
      .pill-glow { animation: pulsePill 3s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .flow-line, .pill-glow { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="860" height="260" rx="14" fill="url(#bgOdHero)" stroke="#1E293B" stroke-width="1.8"/>

  <!-- Top Header Bar -->
  <g class="sans">
    <rect x="18" y="14" width="154" height="22" rx="11" fill="#0C263B" stroke="#00D2FF" stroke-width="1"/>
    <circle cx="30" cy="25" r="3.8" fill="#00F5D4"/>
    <text x="40" y="29" fill="#E0F2FE" font-size="9.5" font-weight="800" letter-spacing="0.5">PURE RUST · AGPL-3.0</text>
    <text x="182" y="29" fill="#F8FAFC" font-size="14.5" font-weight="900">
      OmegaDesk Zero-Copy Capture, Hardware Video &amp; Zero-Trust QUIC Mesh Pipeline
    </text>
    <g class="pill-glow">
      <rect x="688" y="12" width="154" height="26" rx="8" fill="#082822" stroke="#10B981" stroke-width="1.2"/>
      <text x="765" y="29" text-anchor="middle" fill="#34D399" class="mono" font-size="10" font-weight="800">60 FPS · 24.5ms E2E</text>
    </g>
  </g>

  <!-- Animated Connector Pipes -->
  <g fill="none" stroke="url(#pipeCyan)" stroke-width="2.2" class="flow-line">
    <line x1="202" y1="130" x2="226" y2="130"/>
    <line x1="414" y1="130" x2="438" y2="130"/>
    <line x1="626" y1="130" x2="650" y2="130"/>
  </g>

  <!-- STAGE 1: HARDWARE CAPTURE -->
  <g class="sans">
    <rect x="18" y="52" width="184" height="156" rx="10" fill="url(#stageCard)" stroke="#38BDF8" stroke-width="1.3"/>
    <text x="30" y="73" fill="#38BDF8" class="mono" font-size="10" font-weight="800">01 · CAPTURE ENGINE</text>
    <text x="30" y="92" fill="#F8FAFC" font-size="12" font-weight="800">Rust Hardware Capture</text>
    <text x="30" y="112" fill="#CBD5E1" class="mono" font-size="9.5">• DXGI Desktop Duplication</text>
    <text x="30" y="128" fill="#CBD5E1" class="mono" font-size="9.5">• WGC / GDI Fallback Chain</text>
    <text x="30" y="144" fill="#CBD5E1" class="mono" font-size="9.5">• IddCx Virtual Display</text>
    <text x="30" y="160" fill="#CBD5E1" class="mono" font-size="9.5">• Session 0 / UAC / Lock</text>
    <text x="30" y="180" fill="#CBD5E1" class="mono" font-size="9.5">• Privacy Screen Blank</text>
    <text x="30" y="198" fill="#34D399" class="mono" font-size="9" font-weight="700">GPU Texture Resident</text>

    <!-- STAGE 2: ZERO-COPY CODEC -->
    <rect x="230" y="52" width="184" height="156" rx="10" fill="url(#stageCard)" stroke="#00F5D4" stroke-width="1.3"/>
    <text x="242" y="73" fill="#00F5D4" class="mono" font-size="10" font-weight="800">02 · HARDWARE CODEC</text>
    <text x="242" y="92" fill="#F8FAFC" font-size="12" font-weight="800">Zero-Copy H.264 / AV1</text>
    <text x="242" y="112" fill="#CBD5E1" class="mono" font-size="9.5">• D3D11VideoProcessor</text>
    <text x="242" y="128" fill="#CBD5E1" class="mono" font-size="9.5">• NVENC / QuickSync / AMF</text>
    <text x="242" y="144" fill="#CBD5E1" class="mono" font-size="9.5">• OpenH264 SW Fallback</text>
    <text x="242" y="160" fill="#CBD5E1" class="mono" font-size="9.5">• Adaptive Video QoS</text>
    <text x="242" y="180" fill="#CBD5E1" class="mono" font-size="9.5">• Dynamic Watermark</text>
    <text x="242" y="198" fill="#34D399" class="mono" font-size="9" font-weight="700">11ms Encode @ 1080p60</text>

    <!-- STAGE 3: QUIC + MESH -->
    <rect x="442" y="52" width="184" height="156" rx="10" fill="url(#stageCard)" stroke="#A855F7" stroke-width="1.3"/>
    <text x="454" y="73" fill="#C084FC" class="mono" font-size="10" font-weight="800">03 · QUIC + MESH</text>
    <text x="454" y="92" fill="#F8FAFC" font-size="12" font-weight="800">Zero-Trust Transport</text>
    <text x="454" y="112" fill="#CBD5E1" class="mono" font-size="9.5">• QUIC TLS 1.3 + Noise IK</text>
    <text x="454" y="128" fill="#CBD5E1" class="mono" font-size="9.5">• STUN + Disco Hole Punch</text>
    <text x="454" y="144" fill="#CBD5E1" class="mono" font-size="9.5">• 1.5s DERP Relay Fallback</text>
    <text x="454" y="160" fill="#CBD5E1" class="mono" font-size="9.5">• HuJSON ACLs + TOTP MFA</text>
    <text x="454" y="180" fill="#CBD5E1" class="mono" font-size="9.5">• *.omega Internal DNS</text>
    <text x="454" y="198" fill="#34D399" class="mono" font-size="9" font-weight="700">Ed25519 / X25519 Bound</text>

    <!-- STAGE 4: NATIVE & WEB CLIENT -->
    <rect x="654" y="52" width="188" height="156" rx="10" fill="url(#stageCard)" stroke="#F97316" stroke-width="1.3"/>
    <text x="666" y="73" fill="#FB923C" class="mono" font-size="10" font-weight="800">04 · CLIENT &amp; RMM</text>
    <text x="666" y="92" fill="#F8FAFC" font-size="12" font-weight="800">Native, Web &amp; Fleet</text>
    <text x="666" y="112" fill="#CBD5E1" class="mono" font-size="9.5">• Native winit + WebCodecs</text>
    <text x="666" y="128" fill="#CBD5E1" class="mono" font-size="9.5">• 9-Digit QuickSupport ID</text>
    <text x="666" y="144" fill="#CBD5E1" class="mono" font-size="9.5">• Resumable SHA-256 Files</text>
    <text x="666" y="160" fill="#CBD5E1" class="mono" font-size="9.5">• .odrec Session Recording</text>
    <text x="666" y="180" fill="#CBD5E1" class="mono" font-size="9.5">• RMM Inventory &amp; Scripts</text>
    <text x="666" y="198" fill="#34D399" class="mono" font-size="9" font-weight="700">17 Modular Rust Crates</text>
  </g>

  <!-- Bottom Telemetry Strip -->
  <rect x="18" y="218" width="824" height="28" rx="7" fill="#081121" stroke="#1E293B" stroke-width="1"/>
  <text x="30" y="236" fill="#94A3B8" class="mono" font-size="10">
    Self-Hosted Alternative to TeamViewer &amp; AnyDesk · Sunshine GPU Pipeline + Tailscale Magicsock + Headscale HuJSON Policy + Built-in RMM
  </text>
</svg>
