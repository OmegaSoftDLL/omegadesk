[package]
name = "omegadesk-agent"
description = "OmegaDesk agent: shares this machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
omegadesk-capture.workspace = true
omegadesk-codec.workspace = true
omegadesk-control.workspace = true
omegadesk-identity.workspace = true
omegadesk-idd.workspace = true
omegadesk-input.workspace = true
omegadesk-magicsock.workspace = true
omegadesk-protocol.workspace = true
omegadesk-service.workspace = true
omegadesk-session = { workspace = true, features = ["io"] }
omegadesk-transport.workspace = true
rand_core.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
