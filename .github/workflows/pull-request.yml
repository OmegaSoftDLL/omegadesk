name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions: {}

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # The PR title becomes the squash commit message on main.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Every commit in the pull request needs a Signed-off-by line that
      # matches its author (Developer Certificate of Origin).
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$commit")"
            if ! git log -1 --format='%B' "$commit" | grep -qF "Signed-off-by: $author"; then
              echo "::error::commit $commit has no 'Signed-off-by: $author' line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fix with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
