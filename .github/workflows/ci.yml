name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job asks for what it needs (zizmor, Tailscale style).
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Oldest Rust release we support; keep in sync with `rust-version` in Cargo.toml.
  MSRV: "1.90"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  typos:
    name: Typos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: typos-cli
      - run: typos

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux screen capture links libpipewire (pipewire-sys runs bindgen), and the
      # capture smoke test needs a virtual X server (Xvfb). See docs/plan.md Phase 7.
      - name: Install Linux capture dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev clang libclang-dev pkg-config xvfb
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features --locked
      # On Linux the capture smoke test runs against a virtual display under xvfb-run.
      - name: Test (Linux, under Xvfb)
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_BUILD_JOBS: "2"
        run: xvfb-run -a cargo test --workspace --all-features --locked -- --test-threads=2
      - name: Test (Windows and macOS)
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace --all-features --locked
      - name: Agent starts on every platform
        run: cargo run -p omegadesk-agent --locked -- --help

  web:
    name: Browser client
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          # Node 22 LTS runs the TypeScript tests directly (type stripping, >= 22.18).
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev clang libclang-dev pkg-config
      - run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +"$MSRV" check --workspace --all-targets --locked
        env:
          RUSTFLAGS: ""

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev clang libclang-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --all-features --locked

  deny:
    name: Licenses and sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  deny-policy:
    name: License policy blocks GPL-2.0-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      # A fixture crate licensed GPL-2.0-only must be rejected by deny.toml.
      # If this check ever passes, the license policy stopped protecting us.
      - name: Expect the license check to fail
        run: |
          if cargo deny --config deny.toml --manifest-path ci/deny-fixture/Cargo.toml check licenses; then
            echo "::error::deny.toml accepted a GPL-2.0-only crate"
            exit 1
          fi
          echo "deny.toml rejected the GPL-2.0-only fixture as expected"

  advisories:
    name: Security advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A new RUSTSEC advisory should not block unrelated pull requests; this job
    # reports it and Dependabot opens the fix.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
