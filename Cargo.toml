[workspace]
resolver = "3"
members = ["crates/*", "agent", "client", "drivers/idd", "quicksupport", "relay", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/OmegaSoftDLL/omegadesk"
publish = false

[workspace.dependencies]
omegadesk-identity = { path = "crates/identity" }
omegadesk-protocol = { path = "crates/protocol" }
omegadesk-capture = { path = "crates/capture" }
omegadesk-codec = { path = "crates/codec" }
omegadesk-idd = { path = "drivers/idd" }
omegadesk-input = { path = "crates/input" }
omegadesk-transport = { path = "crates/transport" }
omegadesk-noise = { path = "crates/noise" }
omegadesk-tun = { path = "crates/tun" }
omegadesk-mesh = { path = "crates/mesh" }
omegadesk-mcp = { path = "crates/mcp" }
omegadesk-control = { path = "crates/control" }
omegadesk-magicsock = { path = "crates/magicsock" }
omegadesk-policy = { path = "crates/policy" }
omegadesk-rdp = { path = "crates/rdp" }
omegadesk-recording = { path = "crates/recording" }
omegadesk-session = { path = "crates/session" }
omegadesk-quicksupport = { path = "quicksupport" }
omegadesk-relay = { path = "relay" }
omegadesk-server = { path = "server" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
if-addrs = "0.13"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize", "pkcs8"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
openh264 = "0.9"
prost = "0.13"
prost-build = "0.13"
proptest = "1"
protox = "0.7"
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
softbuffer = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio-tungstenite = "0.29"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = "0.62"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
wildcard_enum_match_arm = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
similar_names = "allow"

[profile.test.package.proptest]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
