[package]
name = "omegadesk-session"
description = "Session channels (clipboard, file transfer, Opus audio, multi-monitor, chat, terminal), adaptive video QoS, Reed-Solomon FEC, and serverless LAN mode (mDNS + TOFU)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# OS clipboard worker (`arboard`) and QUIC file transfer driver used by the
# agent and the client; the default build stays pure data types and state machines.
io = ["dep:arboard", "dep:omegadesk-transport", "dep:tokio", "dep:tracing"]

[dependencies]
arboard = { workspace = true, optional = true }
bytes.workspace = true
omegadesk-identity.workspace = true
omegadesk-protocol.workspace = true
omegadesk-transport = { workspace = true, optional = true }
rand_core.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
