[package]
name = "omegadesk-mcp"
description = "Model Context Protocol server for OmegaDesk (rmcp over stdio): mesh device directory, session launcher and guarded actions behind the per-machine trust engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "omegadesk-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
data-encoding.workspace = true
omegadesk-control.workspace = true
omegadesk-identity.workspace = true
omegadesk-magicsock.workspace = true
ring.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }

[lints]
workspace = true
