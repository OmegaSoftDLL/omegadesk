// OmegaDesk session protocol, version 1.
//
// Every wire message travels inside an Envelope. New message kinds are added
// as new fields of the oneof without reusing retired field numbers.
syntax = "proto3";

package omegadesk.v1;

message Envelope {
  oneof payload {
    Hello hello = 1;
    HelloAck hello_ack = 2;
    Ping ping = 3;
    Pong pong = 4;
    Error error = 5;
    RequestKeyframe request_keyframe = 6;
    FrameAck frame_ack = 7;
    InvalidateReferenceFrames invalidate_ref_frames = 8;
    VideoFrame video_frame = 10;
    AudioFrame audio_frame = 11;
    DisplayList display_list = 12;
    SelectDisplay select_display = 13;
    KeyEvent key_event = 20;
    PointerEvent pointer_event = 21;
    ClipboardEvent clipboard_event = 30;
    FileTransferOffer file_transfer_offer = 31;
    FileTransferChunk file_transfer_chunk = 32;
    FileTransferAck file_transfer_ack = 33;
    ChatMessage chat_message = 40;
    TerminalData terminal_data = 41;
    TerminalResize terminal_resize = 42;
    MfaRequired mfa_required = 50;
    MfaResponse mfa_response = 51;
  }
}

// First message sent by the initiator of the connection.
message Hello {
  uint32 protocol_version = 1;
  // Ed25519 device signing public key (32 bytes).
  bytes device_public_key = 2;
  string device_name = 3;
  Capabilities capabilities = 4;
  // Access password displayed by the agent. Without it the agent rejects the connection.
  string access_password = 5;
  // Self-reported device posture, evaluated by the agent against the session
  // policy distributed by the coordinator (Phase 5). Optional: a policy that
  // requires a minimum OS version rejects a Hello without it.
  DevicePosture posture = 6;
}

// Endpoint posture attributes reported by the connecting device (Tailscale
// `Hostinfo` model: self-reported, so policies pair them with checks the agent
// can verify itself, such as the source network).
message DevicePosture {
  // `windows`, `linux` or `macos`.
  string os_family = 1;
  uint32 os_major = 2;
  uint32 os_minor = 3;
  // Patch level, or the build number on Windows.
  uint32 os_patch = 4;
}

// Sent by the agent after a valid Hello when the session policy requires
// per-connection MFA (`"action": "check"`): the client must answer with an
// MfaResponse carrying the same challenge_id before HelloAck is sent
// (RustDesk `REQUIRE_2FA` login flow, RFC 6238 TOTP).
message MfaRequired {
  string challenge_id = 1;
  // Human-readable method hint shown by the client (`totp`).
  string method = 2;
  // Attempts left for this challenge before the connection is rejected.
  uint32 attempts_left = 3;
}

message MfaResponse {
  string challenge_id = 1;
  // Six-digit TOTP code typed by the operator.
  string code = 2;
}

message HelloAck {
  uint32 protocol_version = 1;
  bytes device_public_key = 2;
  string device_name = 3;
  Capabilities capabilities = 4;
  // Codec chosen for this session from the intersection of both peers' capabilities.
  VideoCodec selected_codec = 5;
}

message Capabilities {
  repeated VideoCodec decoders = 1;
  repeated VideoCodec encoders = 2;
}

enum VideoCodec {
  VIDEO_CODEC_UNSPECIFIED = 0;
  VIDEO_CODEC_H264 = 1;
  VIDEO_CODEC_H265 = 2;
  VIDEO_CODEC_AV1 = 3;
  VIDEO_CODEC_VP9 = 4;
}

// Round-trip latency probe. The timestamp comes from the sender's clock and
// is echoed back unchanged in Pong.
message Ping {
  uint64 sequence = 1;
  uint64 sent_at_micros = 2;
}

message Pong {
  uint64 sequence = 1;
  uint64 ping_sent_at_micros = 2;
}

// Sent when the client lost the frame sequence (decode error or dropped frame)
// and needs an IDR keyframe to resume rendering.
message RequestKeyframe {}

// Per-frame acknowledgement sent by the client after decoding a frame
// (modeled after Selkies websockets_mode.py and RustDesk video_qos.rs).
message FrameAck {
  uint64 frame_sequence = 1;
  uint64 captured_at_micros = 2;
  uint32 decode_micros = 3;
  uint32 queue_depth = 4;
}

// Sent when specific frames were lost so the encoder can invalidate reference
// frames without emitting a full IDR frame spike (modeled after Sunshine).
message InvalidateReferenceFrames {
  uint64 first_lost_sequence = 1;
  uint64 last_lost_sequence = 2;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED_VERSION = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_NO_COMMON_CODEC = 3;
  ERROR_CODE_INTERNAL = 4;
  // The coordinator's session policy does not allow this peer to connect.
  ERROR_CODE_POLICY_DENIED = 5;
  // Per-connection MFA failed, timed out or the peer is locked out.
  ERROR_CODE_MFA_FAILED = 6;
  // The connecting device does not satisfy the policy's posture requirements.
  ERROR_CODE_POSTURE_REJECTED = 7;
}

message VideoFrame {
  uint64 sequence = 1;
  // Capture timestamp on the host's clock.
  uint64 captured_at_micros = 2;
  // Time elapsed between screen capture and completion of encoding on the host.
  // The client adds network, decode, and render times to display total latency.
  uint32 host_processing_micros = 3;
  VideoCodec codec = 4;
  bool keyframe = 5;
  uint32 display_index = 6;
  uint32 width = 7;
  uint32 height = 8;
  bytes data = 9;
}

// Opus RESTRICTED_LOWDELAY audio packet (modeled after Sunshine src/audio.cpp).
message AudioFrame {
  uint64 sequence = 1;
  uint64 captured_at_micros = 2;
  uint32 sample_rate = 3;
  uint32 channels = 4;
  bytes opus_data = 5;
}

message DisplayDescriptor {
  uint32 index = 1;
  string name = 2;
  uint32 width = 3;
  uint32 height = 4;
  int32 origin_x = 5;
  int32 origin_y = 6;
  uint32 scale_percent = 7;
  bool primary = 8;
}

message DisplayList {
  repeated DisplayDescriptor displays = 1;
  uint32 active_display_index = 2;
}

message SelectDisplay {
  uint32 display_index = 1;
}

message KeyEvent {
  // Physical scancode (USB HID usage) and keysym so international keyboard
  // layouts (including ABNT2) work across both peers.
  uint32 hid_usage = 1;
  uint32 keysym = 2;
  bool pressed = 3;
  uint32 modifiers = 4;
}

message PointerEvent {
  uint32 display_index = 1;
  // Normalized absolute position in 0..=65535 along both axes.
  uint32 x = 2;
  uint32 y = 3;
  uint32 buttons = 4;
  int32 wheel_x = 5;
  int32 wheel_y = 6;
}

enum ClipboardFormat {
  CLIPBOARD_FORMAT_UNSPECIFIED = 0;
  CLIPBOARD_FORMAT_UTF8_TEXT = 1;
  CLIPBOARD_FORMAT_HTML = 2;
  CLIPBOARD_FORMAT_FILE_LIST = 3;
}

message ClipboardEvent {
  ClipboardFormat format = 1;
  bytes data = 2;
  // SHA-256 digest of `data` used to suppress echo loops.
  bytes content_sha256 = 3;
}

message FileTransferOffer {
  uint64 transfer_id = 1;
  string relative_path = 2;
  uint64 total_bytes = 3;
  bytes file_sha256 = 4;
  uint64 resume_offset = 5;
}

message FileTransferChunk {
  uint64 transfer_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool eof = 4;
}

message FileTransferAck {
  uint64 transfer_id = 1;
  uint64 next_offset = 2;
  bool completed = 3;
  bool verified = 4;
}

message ChatMessage {
  uint64 message_id = 1;
  string sender_name = 2;
  uint64 sent_at_micros = 3;
  string body = 4;
}

message TerminalData {
  uint32 session_id = 1;
  bytes data = 2;
}

message TerminalResize {
  uint32 session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}
